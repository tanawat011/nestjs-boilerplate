# Local development stack: the API and PostgreSQL.
#   docker compose up --build
# The API listens on http://localhost:3000 (Swagger UI at /docs).
# PostgreSQL is published on 127.0.0.1:15433 (not 5432, so it never collides
# with a local server). Every value here is a development default: never
# reuse them in production.

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nestjs
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-15433}:5432"
    volumes:
      # PostgreSQL 18 images keep their data under /var/lib/postgresql/18.
      - db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nestjs"]
      interval: 2s
      timeout: 5s
      retries: 15

  app:
    build: .
    ports:
      - "${APP_HOST_PORT:-3000}:3000"
    environment:
      NODE_ENV: development
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DATABASE: nestjs
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-access-secret-do-not-use-in-production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-only-insecure-refresh-secret-do-not-use-in-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 3s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  db:
