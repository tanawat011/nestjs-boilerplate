name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 15433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:15433/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run format:check
      - run: bun run typecheck
      - run: bun run build
      - run: bun run test
      - run: bun run test:e2e
      - run: bun audit

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: docker compose up
        run: docker compose up -d --build --wait
      - name: Smoke test
        run: |
          curl -fsS http://127.0.0.1:3000/health
          curl -fsS -X POST http://127.0.0.1:3000/api/v1/auth/register \
            -H 'Content-Type: application/json' \
            -d '{"email":"ciuser@example.com","password":"ci-password-123","firstName":"CI","lastName":"User"}'
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - run: docker compose down -v
